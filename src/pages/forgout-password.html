<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Senha</title>
    <link rel="stylesheet" href="../style/forgout-password.css"></head>
</head>
    <body>
    <header id="cabecario-topo">
        <div class="container-titulo">
            <img class="img-titulo" alt="logo" src="../imgs/livro-figura.svg">
            <h2 class="titulo">Biblioteca Esqueci Senha</h2>
        </div>
    </header>

    <section id="corpo">

        <article class="container-frase">
            <div class="frase">
                <h3 class="linha1">Bem Vindo(a)</h2>
                <h1 class="linha2">A Leitura Abre</h1>
                <h1 class="linha3">Novos Mundos</h1>
                <h4 class="linha4">Acesse sua conta e assista a sua experiência</h3>
            </div>
        </article>

        <article class="container-form">
            <div class="container-titulo-img-form">
                <div class="img-form">
                    <a href="../pages/login.html">
                        <img src="../imgs/voltar-seta.svg">
                    </a>
                </div>
                <div class="titulo-form">
                    <img src="../imgs/livro-figura.svg">
                    <h2>Recuperar Senha</h2>
                </div>
            </div>
            <diV class="container-form-imgs">
                <div class="imgs-form">
                    <img src="../imgs/mail.svg" alt="email">
                    <img src="../imgs/cpf.svg" alt="cpf">
                    <img src="../imgs/key.svg" alt="senha">
                    <img src="../imgs/key.svg" alt="confirmar-senha">
                </div>

                <div class="info">
                    <p>E-mail:</p>
                    <input placeholder="email@gmail.com" type="email">

                    <p>CPF:</p>
                    <input placeholder="000.000.000-00" type="tel">
                
                    <p>Nova Senha:</p>
                    <input placeholder="Nova Senha" type="password">

                    <p>Confirmar Nova Senha:</p>
                    <input placeholder="Confirmar Nova Senha" type="password">
                </div>
            </diV>

            <div class="botoes">
                <button class="btn-enviar">Enviar</button>
                <p class="monitor-normal">----------------ou-----------------</p>
                <p class="monitor-maior">------------------ou----------------</p>
                <button class="btn-cancelar">Cancelar</button>
            </div>

        </article>

    </section>
</body>
</html>
