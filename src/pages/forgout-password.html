<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Senha</title>
    <link rel="stylesheet" href="../style/forgout-password.css"></head>
</head>
    <body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../imgs/book.svg">
            <h2 class="title">Biblioteca Esqueci Senha</h2>
        </div>
    </header>   

    <section id="body">

        <article class="container-phrase">
            <div class="phrase">
                <h3 class="line1">Bem Vindo(a)</h2>
                <h1 class="line2">A Leitura Abre</h1>
                <h1 class="line3">Novos Mundos</h1>
                <h4 class="line4">Acesse sua conta e assista a sua experiência</h3>
            </div>
        </article>

        <article class="container-form">
            <div class="container-title-img-form">
                <div class="img-form">
                    <a href="../pages/login.html">
                        <img src="../imgs/back-arrow.svg">
                    </a>
                </div>
                <div class="title-form">
                    <img src="../imgs/book.svg">
                    <h2>Recuperar Senha</h2>
                </div>
            </div>
            <diV class="container-form-imgs">
                <div class="imgs-form">
                    <img src="../imgs/mail.svg" alt="email">
                    <img src="../imgs/cpf.svg" alt="cpf">
                    <img src="../imgs/key.svg" alt="senha">
                    <img src="../imgs/key.svg" alt="confirmar-senha">
                </div>

                <div class="info">
                    <p>E-mail:</p>
                    <input placeholder="email@gmail.com" type="email">

                    <p>CPF:</p>
                    <input placeholder="000.000.000-00" type="tel">
                
                    <p>Nova Senha:</p>
                    <input placeholder="Nova Senha" type="password">

                    <p>Confirmar Nova Senha:</p>
                    <input placeholder="Confirmar Nova Senha" type="password">
                </div>
            </diV>

            <div class="btns">
                <button class="btn-send">Enviar</button>
                <p class="monitor-normal">----------------ou-----------------</p>
                <p class="monitor-larger">------------------ou----------------</p>
                <button class="btn-cancel">Cancelar</button>
            </div>

        </article>

    </section>
</body>
</html>
