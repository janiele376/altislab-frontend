<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc_title_forgot_pwd">Esqueci Senha</title>
    <link rel="stylesheet" href="../style/forgout-password.css">
    <link rel="stylesheet" href="../../style/theme.css">
    <script src="../js/forgout-password.js" defer></script>
    <script src="../../js/theme.js"></script>
    <script src="../js/language.js" defer></script>
</head>

<body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../imgs/book.svg">
            <h2 class="title" data-i18n="header_title_forgot_pwd">Biblioteca Esqueci Senha</h2>
        </div>
    </header>

    <section id="body">

        <article class="container-phrase">
            <div class="phrase">
                <h2 class="line1" data-i18n="banner_welcome">Bem Vindo(a)</h2>
                <h1 class="line2" data-i18n="banner_line2">A Leitura Abre</h1>
                <h1 class="line3" data-i18n="banner_line3">Novos Mundos</h1>
                <h3 class="line4" data-i18n="banner_line4">Acesse sua conta e assista a sua experiência</h3>
            </div>
        </article>

        <article class="container-form">
            <div class="container-title-img-form">
                <div class="img-form">
                    <a href="../pages/login.html">
                        <img src="../imgs/back-arrow.svg" class="img-back-arrow" alt="Voltar">
                    </a>
                </div>
                <div class="title-form">
                    <img src="../imgs/book.svg" alt="Ícone Livro">
                    <h2 data-i18n="title_recover_pwd">Recuperar Senha</h2>
                </div>
            </div>
            <div class="container-form-imgs">
                <div class="imgs-form">
                    <img src="../imgs/mail.svg" alt="email">
                    <img src="../imgs/cpf.svg" alt="cpf">
                    <img src="../imgs/key.svg" alt="senha">
                    <img src="../imgs/key.svg" alt="confirmar-senha">
                </div>

                <div class="info">
                    <p data-i18n="label_email">E-mail:</p>
                    <input placeholder="email@gmail.com" type="email">

                    <p data-i18n="label_cpf">CPF:</p>
                    <input placeholder="000.000.000-00" type="tel">

                    <p data-i18n="label_new_password">Nova Senha:</p>
                    <input placeholder="Nova Senha" type="password" maxlength="8"
                        data-i18n-placeholder="placeholder_new_pwd">

                    <p data-i18n="label_confirm_password">Confirmar Nova Senha:</p>
                    <input placeholder="Confirmar Nova Senha" type="password" maxlength="8"
                        data-i18n-placeholder="placeholder_confirm_pwd">
                </div>
            </div>

            <div class="btns">
                <button class="btn-send" data-i18n="btn_send">Enviar</button>
                <p class="monitor-normal" data-i18n="divider_or_long">----------------ou-----------------</p>
                <p class="monitor-larger" data-i18n="divider_or_long">------------------ou----------------</p>
                <button class="btn-cancel" data-i18n="btn_cancel_action">Cancelar</button>
            </div>

        </article>

    </section>
</body>

</html>
