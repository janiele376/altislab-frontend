<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-translation="doc_title_forgot_pwd">Esqueci Senha</title>

    <link rel="stylesheet" href="../style/forgot-password.css">
    <link rel="stylesheet" href="../style/theme.css">

    <script src="../js/utils/toggle-password.js" defer></script>
    <script src="../js/utils/masks.js" defer></script>
    <script src="../js/auth/forgot-password.js" defer></script>
</head>

<body>

    <header id="header">

        <div class="container-title">

            <img class="img-book" src="../imgs/book.svg" alt="Logo">

            <h2 class="title" data-translation="header_title_forgot_pwd">
                Biblioteca Esqueci Senha
            </h2>

        </div>

    </header>

    <main id="body">

        <article class="container-phrase">

            <div class="phrase">

                <h2 class="line1" data-translation="banner_welcome">
                    Bem Vindo(a)
                </h2>

                <h1 class="line2" data-translation="banner_line2">
                    A Leitura Abre
                </h1>

                <h1 class="line3" data-translation="banner_line3">
                    Novos Mundos
                </h1>

                <h3 class="line4" data-translation="banner_line4">
                    Acesse sua conta e assista a sua experiência
                </h3>

            </div>

        </article>

        <article class="container-form">

            <div class="container-title-img-form">

                <div class="img-form">

                    <a href="../pages/index.html">

                        <img src="../imgs/back-arrow.svg" class="img-back-arrow" alt="Voltar">

                    </a>

                </div>

                <div class="title-form">

                    <img src="../imgs/book.svg" alt="Livro">

                    <h2 data-translation="title_recover_pwd">
                        Recuperar Senha
                    </h2>

                </div>

            </div>

            <div class="container-form-imgs">

                <div class="imgs-form">

                    <img src="../imgs/mail.svg" alt="E-mail">
                    <img src="../imgs/cpf.svg" alt="CPF">
                    <img src="../imgs/key.svg" alt="Nova senha">
                    <img src="../imgs/key.svg" alt="Confirmar nova senha">

                </div>

                <div class="info">

                    <p data-translation="label_email">
                        E-mail:
                    </p>

                    <input type="email" id="input-email" placeholder="email@gmail.com">

                    <p data-translation="label_cpf">
                        CPF:
                    </p>

                    <input type="tel" id="input-cpf" placeholder="000.000.000-00">

                    <p data-translation="label_new_password">
                        Nova Senha:
                    </p>

                    <div class="container-password-input">

                        <input type="password" id="input-password" placeholder="Nova Senha" maxlength="8"
                            data-translation-placeholder="placeholder_new_pwd">

                        <img class="btn-toggle-password" id="toggle-password" src="../imgs/visibility_off.svg"
                            alt="Mostrar nova senha">

                    </div>

                    <p data-translation="label_confirm_password">
                        Confirmar Nova Senha:
                    </p>

                    <div class="container-password-input">

                        <input type="password" id="input-new-password" placeholder="Confirmar Nova Senha" maxlength="8"
                            data-translation-placeholder="placeholder_confirm_pwd">

                        <img class="btn-toggle-password" id="toggle-new-password" src="../imgs/visibility_off.svg"
                            alt="Mostrar confirmação da senha">

                    </div>

                </div>

            </div>

            <div class="btns">

                <button type="button" class="btn-send" data-translation="btn_send">
                    Enviar
                </button>

                <div class="divider">

                    <span></span>

                    <p>ou</p>

                    <span></span>

                </div>

                <button type="button" class="btn-cancel" data-translation="btn_cancel_action">
                    Cancelar
                </button>

            </div>

        </article>

    </main>

</body>

</html>
