<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-translation="doc_title_publishers">Editoras</title>

    <link rel="stylesheet" href="../../style/admin/list-publishers.css">
    <link rel="stylesheet" href="../../style/theme.css">


    <script src="../../js/utils/masks.js" defer></script>
    <script src="../../js/admin/list-publishers.js" defer></script>
    <script src="../../js/utils/theme.js" defer></script>
    <script src="../../js/utils/language.js" defer></script>
</head>

<body>

    <header id="header">

        <div class="container-title">

            <img class="img-book" src="../../imgs/book.svg" alt="Logo">

            <h2 class="title" data-translation="header_title_publishers">
                Biblioteca Listar Editoras
            </h2>

            <div class="container-dashboard-header">

                <div class="imgs">

                    <img src="../../imgs/user.svg" class="img-user" alt="Usuário">

                    <a href="../admin/settings.html">
                        <img src="../../imgs/adjustments.svg" class="img-adjustments" alt="Ajustes">
                    </a>

                </div>

                <div class="text">
                    <p data-translation="nav_user">Usuário</p>
                    <p data-translation="nav_settings">Ajustes</p>
                </div>

            </div>

        </div>

    </header>

    <main id="body">

        <nav class="container-menu">

            <a class="menu-item" href="../admin/dashboard-admin.html" data-translation="menu_dashboard">
                Dashboard
            </a>

            <a class="menu-item" href="../admin/list-users.html" data-translation="menu_users">
                Usuários
            </a>

            <a class="menu-item" href="../admin/list-rentals.html" data-translation="menu_rentals">
                Aluguéis
            </a>

            <a class="menu-item" href="../admin/list-books.html" data-translation="menu_books">
                Livros
            </a>

            <a class="menu-item active" href="../admin/list-publishers.html" data-translation="menu_publishers">
                Editoras
            </a>

        </nav>

        <section class="container-publishers">

            <div class="container-create-publisher">

                <h2 data-translation="title_create_publisher">
                    Criar Editora
                </h2>

                <button type="button" class="btn-create-publisher" id="open-modal-create"
                    data-translation="btn_new_publisher">
                    + Nova Editora
                </button>

            </div>

            <div class="container-list">

                <div class="container-search">

                    <input type="text" id="input-search" class="input-search" placeholder="Pesquisar editora..."
                        data-translation-placeholder="placeholder_search_publisher">

                    <img src="../../imgs/filters.svg" id="btn-filter" alt="Filtros">

                    <img src="../../imgs/search.svg" id="btn-search" alt="Pesquisar">

                </div>

                <hr class="line-search">

                <div class="container-table-info">

                    <h3 data-translation="col_id">
                        ID
                    </h3>

                    <h3 data-translation="col_name">
                        Nome
                    </h3>

                    <h3 data-translation="col_contact">
                        E-mail/Telefone
                    </h3>

                    <h3 data-translation="col_address">
                        Endereço
                    </h3>

                    <h3 class="action" data-translation="col_actions">
                        Ações
                    </h3>

                </div>

                <hr class="line-header-divider">

                <div id="publishers-list"></div>

                <div class="btn-next-page">

                    <button type="button" class="btn-prev" id="btn-prev">
                        <img src="../../imgs/arrow_next_left.svg" alt="Página anterior">
                    </button>

                    <p>
                        <span id="current-page">1</span>
                        de
                        <span id="total-pages">1</span>
                    </p>

                    <button type="button" class="btn-next" id="btn-next">
                        <img src="../../imgs/arrow_next_right.svg" alt="Próxima página">
                    </button>

                </div>

            </div>

        </section>

        <dialog id="modal-create">

            <div class="container-create-publishers">

                <div class="container-title-publisher">

                    <button type="button" id="close-modal-create" class="btn-back-modal">
                        <img src="../../imgs/back-arrow.svg" class="img-publisher-form" alt="Voltar">
                    </button>

                    <h2 class="title-publisher-form" id="modal-publisher-title"
                        data-translation="modal_create_publisher_title">
                        Criar Editora
                    </h2>

                </div>

                <div class="container-form">

                    <div class="input-group">

                        <label for="publisher-name" data-translation="label_form_publisher_name">
                            Nome da Editora:
                        </label>

                        <input class="publisher-name" id="publisher-name" type="text">

                    </div>

                    <div class="input-group">

                        <label for="publisher-cnpj" data-translation="label_form_publisher_cnpj">
                            CNPJ da Editora:
                        </label>

                        <input class="publisher-cnpj" id="publisher-cnpj" type="text">

                    </div>

                    <div class="input-group">

                        <label for="publisher-email" data-translation="label_form_email">
                            E-mail:
                        </label>

                        <input class="publisher-email" id="publisher-email" type="email">

                    </div>

                    <div class="input-group">

                        <label for="publisher-phone" data-translation="label_form_phone">
                            Telefone:
                        </label>

                        <input class="publisher-phone" id="publisher-phone" type="tel">

                    </div>

                    <div class="input-group">

                        <label for="publisher-address" data-translation="label_form_address">
                            Endereço:
                        </label>

                        <input class="publisher-address" id="publisher-address" type="text">

                    </div>

                    <div class="btns-publishers">

                        <button type="button" class="btn-check" id="btn-save-publisher">
                            <img src="../../imgs/check.svg" alt="Confirmar">

                            <span data-translation="btn_confirm">
                                CONFIRMAR
                            </span>
                        </button>

                        <button type="button" class="btn-cancel" id="cancel-create">
                            <img src="../../imgs/cancel.svg" alt="Cancelar">

                            <span data-translation="btn_cancel">
                                CANCELAR
                            </span>
                        </button>

                    </div>

                </div>

            </div>

        </dialog>

    </main>

</body>

</html>
