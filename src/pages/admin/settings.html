<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc_title_settings">Configurações</title>
    <link rel="stylesheet" href="../../style/admin/settings.css">
    <link rel="stylesheet" href="../../style/theme.css">
    <script src="../../js/tenant/settings-accessibility.js" defer></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/language.js" defer></script>
</head>
<body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../../imgs/book.svg">
            <h2 class="title" data-i18n="header_title_settings">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="body">

        <article class="container-accessibility">
            <div class="container-title-img-form">
                <div class="img-form">
                    <a href="../../pages/admin/dashboard-admin.html">
                        <img src="../../imgs/back-arrow.svg" alt="Voltar">
                    </a>
                </div>
                <div class="title-form">
                    <img src="../../imgs/book.svg" alt="ícone livro">
                    <h2 data-i18n="title_settings">Configurações</h2>
                </div>
            </div>

            <hr class="line">

            <div class="container-btns-info">
            
                <div class="info">
                    <p data-i18n="label_system_theme">Cor do Sistema: </p>
                    <p data-i18n="label_system_language">Idioma do Sistema: </p>
                </div>

                <div class="btns">
                    <button id="btn-light" class="btn-light" data-i18n="btn_theme_light">Claro</button>
                    <button id="btn-dark" class="btn-dark" data-i18n="btn_theme_dark">Escuro</button><br>
                    <select id="select-language" class="select-language">
                        <option value="" disabled selected data-i18n="opt_select">Selecione</option>
                        <option value="pt">Português - Brasil</option>
                        <option value="en">English - EUA</option>
                        <option value="es">Español - Espanha</option>
                    </select>
                </div>
            </div>

            <hr class="line">

        </article>

    </section>
</body>
</html>
