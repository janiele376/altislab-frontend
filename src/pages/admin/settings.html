<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-translation="doc_title_settings">Configurações</title>

    <link rel="stylesheet" href="../../style/admin/settings.css">
    <link rel="stylesheet" href="../../style/theme.css">

    <script src="../../js/tenant/settings-accessibility.js" defer></script>
    <script src="../../js/utils/theme.js" defer></script>
    <script src="../../js/utils/language.js" defer></script>
</head>

<body>

    <header id="header">

        <div class="container-title">

            <img class="img-book" src="../../imgs/book.svg" alt="Logo">

            <h2 class="title" data-translation="header_title_settings">
                Biblioteca Configurações
            </h2>

        </div>

    </header>

    <main id="body">

        <section class="container-accessibility">

            <div class="container-title-img-form">

                <div class="img-form">

                    <button type="button" id="btn-back" class="btn-back">
                        <img src="../../imgs/back-arrow.svg" alt="Voltar">
                    </button>

                </div>

                <div class="title-form">

                    <img src="../../imgs/book.svg" alt="Ícone livro">

                    <h2 data-translation="title_settings">
                        Configurações
                    </h2>

                </div>

            </div>

            <hr class="line">

            <div class="container-settings">

                <div class="setting-group">

                    <p data-translation="label_system_theme">
                        Cor do Sistema:
                    </p>

                    <div class="theme-buttons">

                        <button type="button" id="btn-light" class="btn-light" data-translation="btn_theme_light">
                            Claro
                        </button>

                        <button type="button" id="btn-dark" class="btn-dark" data-translation="btn_theme_dark">
                            Escuro
                        </button>

                    </div>

                </div>

                <div class="setting-group">

                    <label for="select-language" data-translation="label_system_language">
                        Idioma do Sistema:
                    </label>

                    <select id="select-language" class="select-language">
                        <option value="" disabled selected data-translation="opt_select">
                            Selecione
                        </option>

                        <option value="pt">
                            Português - Brasil
                        </option>

                        <option value="en">
                            English - EUA
                        </option>

                        <option value="es">
                            Español - Espanha
                        </option>

                    </select>

                </div>

            </div>

            <hr class="line">

        </section>

    </main>

</body>

</html>
