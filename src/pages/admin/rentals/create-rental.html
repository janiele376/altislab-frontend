<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style/admin/rentals/create-rental.css">
    <title>Aluguéis</title>
</head>
<body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../../../imgs/book.svg">
            <h2 class="title">Biblioteca Dashboard</h2>
            <div class="container-dashboard-header">
                <div class="imgs">
                    <img src="../../../imgs/user-img-ex.jpg" class="img-user">
                    <a href="../settings.html"><img src="../../../imgs/adjustments.svg" class="img-adjustments"></a>  
                </div>

                <div class="text">   
                    <p>User</p>  <p>Ajustes</p>
                </div>
            </div>
        </div>
    </header>

    <section id="body">

        <article class="container-rentals">
            <div class="container-title-rental">
                <a href="../rentals/list-rentals.html"><img src="../../../imgs/back-arrow.svg" class="img-rental-form"></a>
                <h1 class="title-rental-form">Criar Aluguel</h1>
            </div>
            
            <div class="container-form">
                <div class="container-name-user">
                    <p>Nome do Usuário:</p>
                    <input class="name-user" type="text">
                </div>

                <div>
                    <p>CPF do Usuário:</p>
                    <input class="cpf-user" type="tel">
                </div>

                <div>
                    <p>Nome do Livro:</p>
                    <input class="book-name" type="text">
                </div>

                <div>
                    <p>Código do Livro:</p>
                    <input class="book-cod" type="tel">
                </div>

                <div>
                    <p>Data Início do Aluguel:</p>
                    <input class="date-rental" type="date">
                </div>
            
            <div class="btns-rentals">
                <button class="btn-check"><img src="../../../imgs/check.svg">CONFIRMAR</button>
                <button class="btn-cancel"><img src="../../../imgs/cancel.svg">CANCELAR</button>
            </div>

            </div>
        </article>
    </section>
</body>
</html>
