<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/editing-information.css"></head>
</head>
    <body>
    <header id="cabecario-topo">
        <div class="container-titulo">
            <img class="img-titulo" alt="logo" src="../../imgs/livro-figura.svg">
            <h2 class="titulo">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="corpo">

        <article class="container-profile">
            <div class="container-titulo-img-form">
                <div class="titulo-form">
                    <img src="../../imgs/livro-figura.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-perfil">Perfil</button>
                <button class="btn-acessibilidade">Acessibilidade</button>
            </div>

            <div class="container-img-profile">
                <img src="../../imgs/user-img-ex.jpg" class="img-user">
                <p class="nome-user">Nome Completo</p>
            </div>

            <hr class="linha">

            <div class="container-imgs-info-profile">
                <div class="imgs-profile">
                    <img src="../../imgs/mail.svg">
                    <img src="../../imgs/telefone.svg">
                    <img src="../../imgs/calendario.svg">
                    <img src="../../imgs/cpf.svg">
                    <img src="../../imgs/local.svg">

                </div>
            
                <div class="info-profile">
                    <p>E-mail: </p>
                    <p>Telefone: </p>
                    <p>Data de Nascimento: </p>
                    <p>CPF: </p>
                    <p>Endereço: </p>
                </div>

                <div class="inputs-profile">
                    <input placeholder="email@gmail.com" type="email" class="campo-email">
                    <input placeholder="00 0 0000-0000" type="tel" class="campo-telefone">
                    <input placeholder="DD/MM/YYYY" type="date" class="campo-data">
                    <input placeholder="000.000.000-00" type="tel" class="campo-cpf">
                    <input placeholder="Logradouro, Nº - Bairro"" type="text" class="campo-local">
                </div>
            </div>

            <hr class="linha">

            <div class="container-btns-final">
                <button class="btn-confirmar">Confirmar</button>
                <p>----ou----</p>
                <button class="btn-cancelar">Cancelar</button>
            </div>

        </article>

    </section>
</body>
</html>
