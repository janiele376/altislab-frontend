<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-translation="doc_title_settings">Configurações</title>

    <link rel="stylesheet" href="../../style/tenant/editing-information.css">
    <link rel="stylesheet" href="../../style/theme.css">

    <script src="../../js/utils/toggle-password.js" defer></script>
    <script src="../../js/tenant/editing-information.js" defer></script>
    <script src="../../js/utils/theme.js" defer></script>
    <script src="../../js/utils/language.js" defer></script>
</head>

<body>

    <header id="header">

        <div class="container-title-logo">

            <img class="img-book" src="../../imgs/book.svg" alt="Logo">

            <h2 class="title-config" data-translation="header_title_settings">
                Biblioteca Configurações
            </h2>

        </div>

    </header>

    <main id="body">

        <section class="container-profile">

            <div class="container-title-img-form">

                <div class="img-form">

                    <a href="../tenant/settings-profile.html">
                        <img src="../../imgs/back-arrow.svg" class="img-back-arrow" alt="Voltar">
                    </a>

                </div>

                <div class="title-form">

                    <img src="../../imgs/book.svg" alt="Ícone Livro">

                    <h2 data-translation="title_settings">
                        Configurações
                    </h2>

                </div>

            </div>

            <div class="container-img-profile">

                <button type="button" class="wrapper-avatar-change" id="btn-change-photo"
                    title="Clique para alterar a foto">

                    <img src="../../imgs/user.svg" class="img-user" id="edit-profile-img" alt="Foto de perfil">

                    <span class="overlay-change-photo">

                        <img src="../../imgs/edit-info.svg" alt="Editar foto">

                    </span>

                </button>

                <input type="file" id="input-edit-photo" accept="image/*" hidden>

                <p class="name-user" id="profile-name">
                    Nome Completo
                </p>

            </div>

            <hr class="line">

            <div class="container-profile-information">

                <div class="profile-field">

                    <img src="../../imgs/mail.svg" alt="E-mail">

                    <label for="input-email" data-translation="label_email">
                        E-mail:
                    </label>

                    <input placeholder="email@gmail.com" type="email" name="email" id="input-email">

                </div>

                <div class="profile-field">

                    <img src="../../imgs/telephone.svg" alt="Telefone">

                    <label for="input-telefone" data-translation="label_phone">
                        Telefone:
                    </label>

                    <input placeholder="(00) 90000-0000" type="tel" name="telefone" id="input-telefone">

                </div>

                <div class="profile-field">

                    <img src="../../imgs/calendar.svg" alt="Data de Nascimento">

                    <label for="input-data-nasc" data-translation="label_birth_date">
                        Data de Nascimento:
                    </label>

                    <input type="date" name="data-nascimento" id="input-data-nasc" readonly
                        title="Caso queira trocar, contate o suporte." data-translation-title="tooltip_support_change">

                </div>

                <div class="profile-field">

                    <img src="../../imgs/cpf.svg" alt="CPF">

                    <label for="input-cpf" data-translation="label_cpf">
                        CPF:
                    </label>

                    <input placeholder="000.000.000-00" type="text" name="cpf" id="input-cpf" readonly
                        title="Caso queira trocar, contate o suporte." data-translation-title="tooltip_support_change">

                </div>

                <div class="profile-field">

                    <img src="../../imgs/location.svg" alt="Endereço">

                    <label for="input-localizacao" data-translation="label_address">
                        Endereço:
                    </label>

                    <input placeholder="Logradouro, Nº - Bairro" type="text" name="localizacao" id="input-localizacao"
                        data-translation-placeholder="placeholder_address_format">

                </div>

            </div>

            <hr class="line">

            <div class="container-password-section">

                <div class="password-field">

                    <img src="../../imgs/key.svg" alt="Senha Atual">

                    <label for="input-current-password">
                        <span data-translation="label_old_password">
                            Senha Antiga:
                        </span>
                        *
                    </label>

                    <div class="container-password-input">

                        <input type="password" id="input-current-password" placeholder="Digite sua senha atual"
                            maxlength="8" data-translation-placeholder="placeholder_current_pwd">

                        <img class="btn-toggle-password" id="toggle-current-password"
                            src="../../imgs/visibility_off.svg" alt="Mostrar senha atual">

                    </div>

                </div>

                <div class="password-field">

                    <img src="../../imgs/key.svg" alt="Nova Senha">

                    <label for="input-new-password" data-translation="label_new_password">
                        Nova Senha:
                    </label>

                    <div class="container-password-input">

                        <input type="password" id="input-new-password" placeholder="Digite a nova senha" maxlength="8"
                            data-translation-placeholder="placeholder_new_pwd">

                        <img class="btn-toggle-password" id="toggle-new-password" src="../../imgs/visibility_off.svg"
                            alt="Mostrar nova senha">

                    </div>

                </div>

                <div class="password-field">

                    <img src="../../imgs/key.svg" alt="Confirmar Senha">

                    <label for="input-confirm-password" data-translation="label_confirm_password">
                        Confirmar Senha:
                    </label>

                    <div class="container-password-input">

                        <input type="password" id="input-confirm-password" placeholder="Confirme a nova senha"
                            maxlength="8" data-translation-placeholder="placeholder_confirm_pwd">

                        <img class="btn-toggle-password" id="toggle-confirm-password"
                            src="../../imgs/visibility_off.svg" alt="Mostrar confirmação da senha">

                    </div>

                </div>

                <div class="help-password-link">

                    <button type="button" id="openModalBtn" class="btn-help" data-translation="link_need_help">
                        Quer ajuda?
                    </button>

                </div>

            </div>

            <hr class="line">

            <div class="container-btns-end">

                <button type="button" class="btn-confirm" id="btn-save-changes" data-translation="btn_confirm_action">
                    Confirmar
                </button>

                <p data-translation="divider_or">
                    ----ou----
                </p>

                <a href="../tenant/settings-profile.html" class="btn-cancel" data-translation="btn_cancel_action">
                    Cancelar
                </a>

            </div>

        </section>

    </main>

    <dialog id="supportModal" class="support-modal">

        <div class="support-form">

            <h3 class="modal-title" data-translation="modal_support_title">
                Suporte ao Usuário
            </h3>

            <p class="modal-description" data-translation="modal_support_desc">
                Informe seu e-mail e descreva o motivo do contato para nossa equipe ajudar você.
            </p>

            <label for="supportEmail" class="modal-label" data-translation="label_support_email">
                Seu E-mail:
            </label>

            <input type="email" id="supportEmail" class="modal-input" placeholder="email@exemplo.com" required>

            <label for="supportMessage" class="modal-label" data-translation="label_support_msg">
                Situação / Dúvida:
            </label>

            <textarea id="supportMessage" class="modal-textarea" rows="4" placeholder="Descreva sua solicitação..."
                required data-translation-placeholder="placeholder_support_msg"></textarea>

            <div class="modal-actions">

                <button type="button" class="btn-send-support" id="btn-send-support" data-translation="btn_send">
                    Enviar
                </button>

                <button type="button" id="closeModalBtn" class="btn-close-modal" data-translation="btn_close">
                    Fechar
                </button>

            </div>

        </div>

    </dialog>

</body>

</html>
