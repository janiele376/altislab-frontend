<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc_title_settings">Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/editing-information.css">
    <link rel="stylesheet" href="../../style/theme.css">
    <script src="../../js/tenant/editing-information.js" defer></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/language.js" defer></script>
</head>
<body>
    <header id="header">
        <div class="container-title-logo">
            <img class="img-book" alt="logo" src="../../imgs/book.svg">
            <h2 class="title-config" data-i18n="header_title_settings">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="body">
        <article class="container-profile">
            <div class="container-title-img-form">
                <div class="title-form">
                    <img src="../../imgs/book.svg" alt="Ícone Livro">
                    <h2 data-i18n="title_settings">Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button type="button" class="btn-profile" data-i18n="tab_profile">Perfil</button>
                <button type="button" class="btn-accessibility" data-i18n="tab_accessibility">Acessibilidade</button>
            </div>

            <div class="container-img-profile">
                <img src="../../imgs/user-img-ex.jpg" class="img-user" alt="Foto de perfil">
                <p class="name-user" data-i18n="placeholder_full_name">Nome Completo</p>
            </div>

            <hr class="line">

            <div class="container-imgs-info-profile">
                <div class="imgs-profile">
                    <img src="../../imgs/mail.svg" alt="Email">
                    <img src="../../imgs/telephone.svg" alt="Telefone">
                    <img src="../../imgs/calendar.svg" alt="Data de Nascimento">
                    <img src="../../imgs/cpf.svg" alt="CPF">
                    <img src="../../imgs/location.svg" alt="Endereço">
                </div>
            
                <div class="info-profile">
                    <p data-i18n="label_email">E-mail: </p>
                    <p data-i18n="label_phone">Telefone: </p>
                    <p data-i18n="label_birth_date">Data de Nascimento: </p>
                    <p data-i18n="label_cpf">CPF: </p>
                    <p data-i18n="label_address">Endereço: </p>
                </div>

                <div class="inputs-profile">
                    <input placeholder="email@gmail.com" type="email" name="email">
                    <input placeholder="00 0 0000-0000" type="tel" name="telefone">
                    <input placeholder="DD/MM/YYYY" type="date" name="data-nascimento" readonly title="Caso queira trocar, contate o suporte." data-i18n-title="tooltip_support_change">
                    <input placeholder="000.000.000-00" type="tel" name="cpf" readonly title="Caso queira trocar, contate o suporte." data-i18n-title="tooltip_support_change">
                    <input placeholder="Logradouro, Nº - Bairro" type="text" name="localizacao" data-i18n-placeholder="placeholder_address_format">
                </div>
            </div>

            <hr class="line">

            <div class="container-password-section">
                <div class="container-imgs-info-profile">
                    <div class="imgs-profile">
                        <img src="../../imgs/key.svg" alt="Senha Antiga">
                        <img src="../../imgs/key.svg" alt="Nova Senha">
                        <img src="../../imgs/key.svg" alt="Confirmar Senha">
                    </div>
                
                    <div class="info-profile">
                        <p data-i18n="label_old_password">Senha Antiga: </p>
                        <p data-i18n="label_new_password">Nova Senha: </p>
                        <p data-i18n="label_confirm_password">Confirmar Senha: </p>
                    </div>

                    <div class="inputs-profile">
                        <div class="container-password-input">
                            <input type="password" id="input-current-password" placeholder="Digite sua senha atual" maxlength="8" data-i18n-placeholder="placeholder_current_pwd">
                            <img class="btn-toggle-password" id="toggle-current-password" src="../../imgs/visibility_off.svg" alt="Mostrar senha atual">
                        </div>

                        <div class="container-password-input">
                            <input type="password" id="input-new-password" placeholder="Digite a nova senha" maxlength="8" data-i18n-placeholder="placeholder_new_pwd">
                            <img class="btn-toggle-password" id="toggle-new-password" src="../../imgs/visibility_off.svg" alt="Mostrar nova senha">
                        </div>

                        <div class="container-password-input">
                            <input type="password" id="input-confirm-password" placeholder="Confirme a nova senha" maxlength="8" data-i18n-placeholder="placeholder_confirm_pwd">
                            <img class="btn-toggle-password" id="toggle-confirm-password" src="../../imgs/visibility_off.svg" alt="Mostrar confirmar nova senha">
                        </div>
                    </div>
                </div>

                <div class="help-password-link">
                    <a href="javascript:void(0)" id="openModalBtn" data-i18n="link_need_help">Quer ajuda?</a>
                </div>
            </div>

            <hr class="line">

            <div class="container-btns-end">
                <button type="submit" class="btn-confirm" data-i18n="btn_confirm_action">Confirmar</button>
                <p data-i18n="divider_or">----ou----</p>
                <button type="button" class="btn-cancel" data-i18n="btn_cancel_action">Cancelar</button>
            </div>
        </article>
    </section>

    <dialog id="supportModal" class="support-modal">
        <form method="dialog" class="support-form">
            <h3 class="modal-title" data-i18n="modal_support_title">Suporte ao Usuário</h3>
            <p class="modal-description" data-i18n="modal_support_desc">Informe seu e-mail e descreva o motivo do contato para nossa equipe ajudar você.</p>
            
            <label for="supportEmail" class="modal-label" data-i18n="label_support_email">Seu E-mail:</label>
            <input type="email" id="supportEmail" class="modal-input" placeholder="email@exemplo.com" required>

            <label for="supportMessage" class="modal-label" data-i18n="label_support_msg">Situação / Dúvida:</label>
            <textarea id="supportMessage" class="modal-textarea" rows="4" placeholder="Descreva sua solicitação..." required data-i18n-placeholder="placeholder_support_msg"></textarea>

            <div class="modal-actions">
                <button type="submit" class="btn-send-support" data-i18n="btn_send">Enviar</button>
                <button type="button" id="closeModalBtn" class="btn-close-modal" data-i18n="btn_close">Fechar</button>
            </div>
        </form>
    </dialog>
</body>
</html>
