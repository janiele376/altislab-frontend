<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/editing-information.css"></head>
</head>
    <body>
    <header id="header">
        <div class="container-title-logo">
            <img class="img-book" alt="logo" src="../../imgs/book.svg">
            <h2 class="title-config">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="body">

        <article class="container-profile">
            <div class="container-title-img-form">
                <div class="title-form">
                    <img src="../../imgs/book.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-profile">Perfil</button>
                <button class="btn-accessibility">Acessibilidade</button>
            </div>

            <div class="container-img-profile">
                <img src="../../imgs/user-img-ex.jpg" class="img-user">
                <p class="name-user">Nome Completo</p>
            </div>

            <hr class="line">

            <div class="container-imgs-info-profile">
                <div class="imgs-profile">
                    <img src="../../imgs/mail.svg">
                    <img src="../../imgs/telephone.svg">
                    <img src="../../imgs/calendar.svg">
                    <img src="../../imgs/cpf.svg">
                    <img src="../../imgs/location.svg">

                </div>
            
                <div class="info-profile">
                    <p>E-mail: </p>
                    <p>Telefone: </p>
                    <p>Data de Nascimento: </p>
                    <p>CPF: </p>
                    <p>Endereço: </p>
                </div>

                <div class="inputs-profile">
                    <input placeholder="email@gmail.com" type="email" >
                    <input placeholder="00 0 0000-0000" type="tel" >
                    <input placeholder="DD/MM/YYYY" type="date" >
                    <input placeholder="000.000.000-00" type="tel">
                    <input placeholder="Logradouro, Nº - Bairro" type="text">
                </div>
            </div>

            <hr class="line">

            <div class="container-btns-end">
                <button class="btn-confirm">Confirmar</button>
                <p>----ou----</p>
                <button class="btn-cancel">Cancelar</button>
            </div>

        </article>

    </section>
</body>
</html>
