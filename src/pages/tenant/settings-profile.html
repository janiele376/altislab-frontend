<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/settings-profile.css"></head>
</head>
    <body>
    <header id="cabecario-topo">
        <div class="container-titulo">
            <img class="img-titulo" alt="logo" src="../../imgs/livro-figura.svg">
            <h2 class="titulo">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="corpo">

        <article class="container-profile">
            <div class="container-titulo-img-form">
                <div class="img-form">
                    <a href="../../pages/tenant/dashboard-tenant">
                        <img src="../../imgs/voltar-seta.svg">
                    </a>
                </div>
                <div class="titulo-form">
                    <img src="../../imgs/livro-figura.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-perfil">Perfil</button>
                <button class="btn-acessibilidade" onclick="window.location.href='../tenant/settings-accessibility.html'">Acessibilidade</button>
            </div>

            <div class="container-img-profile">
                <img src="../../imgs/user-img-ex.jpg" class="img-user">
                <p class="nome-user">Nome Completo</p>
            </div>

            <hr class="linha">

            <div class="container-imgs-info-profile">
                <div class="imgs-profile">
                    <img src="../../imgs/mail.svg">
                    <img src="../../imgs/telefone.svg">
                    <img src="../../imgs/calendario.svg">
                    <img src="../../imgs/cpf.svg">
                    <img src="../../imgs/local.svg">

                </div>
            
                <div class="info-profile">
                    <p>E-mail: </p>
                    <p>Telefone: </p>
                    <p>Data de Nascimento: </p>
                    <p>CPF: </p>
                    <p>Endereço: </p>
                </div>
            </div>

            <hr class="linha">

            <button class="editar-info" onclick="window.location.href='../tenant/editing-information.html'"><img src="../../imgs/editar-info.svg" class="figura-editar">Editar Informações</button>
        </article>

    </section>
</body>
</html>
