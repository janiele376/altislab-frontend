<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/settings-profile.css"></head>
</head>
    <body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../../imgs/book.svg">
            <h2 class="title">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="body">

        <article class="container-profile">
            <div class="container-title-img-form">
                <div class="img-form">
                    <a href="../../pages/tenant/dashboard-tenant.html">
                        <img src="../../imgs/back-arrow.svg">
                    </a>
                </div>
                <div class="title-form">
                    <img src="../../imgs/book.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-profile">Perfil</button>
                <button class="btn-accessibility" onclick="window.location.href='../tenant/settings-accessibility.html'">Acessibilidade</button>
            </div>

            <div class="container-img-profile">
                <img src="../../imgs/user-img-ex.jpg" class="img-user">
                <p class="nome-user">Nome Completo</p>
            </div>

            <hr class="line">

            <div class="container-imgs-info-profile">
                <div class="imgs-profile">
                    <img src="../../imgs/mail.svg">
                    <img src="../../imgs/telephone.svg">
                    <img src="../../imgs/calendar.svg">
                    <img src="../../imgs/cpf.svg">
                    <img src="../../imgs/location.svg">

                </div>
            
                <div class="info-profile">
                    <p>E-mail: </p>
                    <p>Telefone: </p>
                    <p>Data de Nascimento: </p>
                    <p>CPF: </p>
                    <p>Endereço: </p>
                </div>
            </div>

            <hr class="line">

            <button class="edit-info" onclick="window.location.href='../tenant/editing-information.html'"><img src="../../imgs/edit-info.svg" class="edit-figure">Editar Informações</button>
        </article>

    </section>
</body>
</html>
