<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/settings-accessibility.css"></head>
</head>
    <body>
    <header id="cabecario-topo">
        <div class="container-titulo">
            <img class="img-titulo" alt="logo" src="../../imgs/livro-figura.svg">
            <h2 class="titulo">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="corpo">

        <article class="container-accessibility">
            <div class="container-titulo-img-form">
                <div class="img-form">
                    <a href="../../pages/tenant/dashboard-tenant">
                        <img src="../../imgs/voltar-seta.svg">
                    </a>
                </div>
                <div class="titulo-form">
                    <img src="../../imgs/livro-figura.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-perfil" onclick="window.location.href='../tenant/settings-profile.html'">Perfil</button>
                <button class="btn-acessibilidade">Acessibilidade</button>
            </div>

            <hr class="linha">

            <div class="container-btns-info">
            
                <div class="info">
                    <p>Cor do Sistema: </p>
                    <p>Idioma do Sistema: </p>
                </div>

                <div class="btns">
                    <button class="btn-claro">Claro</button> <button class="btn-escuro">Escuro</button>
                    <select class="seletor-idioma">
                        <option>Selecione</option>
                        <option>Português - Brasil</option>
                        <option>English - EUA</option>
                        <option>Español - Espanha</option>
                    </select>
                </div>
            </div>

            <hr class="linha">

        </article>

    </section>
</body>
</html>
