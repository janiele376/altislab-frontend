<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link rel="stylesheet" href="../../style/tenant/settings-accessibility.css"></head>
</head>
    <body>
    <header id="header">
        <div class="container-title">
            <img class="img-book" alt="logo" src="../../imgs/book.svg">
            <h2 class="title">Biblioteca Configurações</h2>
        </div>
    </header>

    <section id="body">

        <article class="container-accessibility">
            <div class="container-title-img-form">
                <div class="img-form">
                    <a href="../../pages/tenant/dashboard-tenant">
                        <img src="../../imgs/back-arrow.svg">
                    </a>
                </div>
                <div class="title-form">
                    <img src="../../imgs/book.svg">
                    <h2>Configurações</h2>
                </div>
            </div>

            <div class="container-btns">
                <button class="btn-profile" onclick="window.location.href='../tenant/settings-profile.html'">Perfil</button>
                <button class="btn-accessibility">Acessibilidade</button>
            </div>

            <hr class="line">

            <div class="container-btns-info">
            
                <div class="info">
                    <p>Cor do Sistema: </p>
                    <p>Idioma do Sistema: </p>
                </div>

                <div class="btns">
                    <button class="btn-light">Claro</button> <button class="btn-dark">Escuro</button>
                    <select class="select-language">
                        <option>Selecione</option>
                        <option>Português - Brasil</option>
                        <option>English - EUA</option>
                        <option>Español - Espanha</option>
                    </select>
                </div>
            </div>

            <hr class="line">

        </article>

    </section>
</body>
</html>
